name: Gerar Harvest Invest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gerar-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Licencas do Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Montar o app
        run: |
          VERSAO="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSAO=$VERSAO" >> $GITHUB_ENV
          mkdir -p www/lib assets
          cp index.html www/index.html
          sed -i "s/__VERSAO__/${VERSAO}/g" www/index.html
          npm install --no-audit --no-fund
          cp node_modules/pdfjs-dist/build/pdf.min.js www/lib/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/lib/
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin zip
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-only.png
          sed 's#<rect[^>]*/>##' icon.svg > /tmp/fg.svg
          rsvg-convert -w 1024 -h 1024 /tmp/fg.svg -o assets/icon-foreground.png
          echo '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><rect width="1024" height="1024" fill="#1F4D3A"/></svg>' > /tmp/bg.svg
          rsvg-convert -w 1024 -h 1024 /tmp/bg.svg -o assets/icon-background.png
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor "#1F4D3A" --iconBackgroundColorDark "#1F4D3A" --splashBackgroundColor "#1F4D3A" --splashBackgroundColorDark "#1F4D3A" || echo "Usando icones padrao"
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSAO}\"/" android/app/build.gradle

      - name: Gerar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -q

      - name: Assinar o APK
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
          SENHA_CHAVE: ${{ secrets.SENHA_CHAVE }}
        run: |
          if [ -z "$CHAVE_BASE64" ] || [ -z "$SENHA_CHAVE" ]; then echo "::error::Faltam os secrets CHAVE_BASE64 e SENHA_CHAVE (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$CHAVE_BASE64" | base64 -d > chave.p12
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          $BT/apksigner sign --ks chave.p12 --ks-type PKCS12 --ks-pass env:SENHA_CHAVE --out harvest-invest.apk alinhado.apk
          $BT/apksigner verify harvest-invest.apk
          rm -f chave.p12

      - uses: actions/upload-artifact@v4
        with:
          name: harvest-invest-apk
          path: harvest-invest.apk

      - name: Preparar a página de atualização
        run: |
          mkdir -p site
          (cd www && zip -qr "../site/app-${VERSAO}.zip" .)
          cp harvest-invest.apk site/harvest-invest.apk
          echo "{\"version\":\"${VERSAO}\",\"url\":\"https://jhoonoliveira.github.io/harvest-invest/app-${VERSAO}.zip\"}" > site/update.json
          cat > site/index.html <<HTML
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Harvest Invest</title>
          <body style="font-family:system-ui;background:#1F4D3A;color:#F2F6EF;text-align:center;padding:40px 20px">
          <h1>Harvest Invest</h1><p>Versão ${VERSAO}</p>
          <p><a style="display:inline-block;background:#E9C85A;color:#1b1404;padding:14px 22px;border-radius:12px;font-weight:700;text-decoration:none" href="harvest-invest.apk">Baixar o app (APK)</a></p>
          <p style="opacity:.8;font-size:14px">Depois de instalado, as novas versões chegam sozinhas.</p></body>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
