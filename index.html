  <tr><th colspan="4">Total</th><th class="n">${brl(L.reduce((s,r)=>s+r.bruto,0))}</th><th class="n">${brl(L.reduce((s,r)=>s+r.ir,0))}</th><th class="n">${brl(L.reduce((s,r)=>s+r.liq,0))}</th></tr></table></div>
  <h3 style="margin-top:16px">Bens e direitos em 31/12/${ano}</h3>
  <div class="tbl-wrap"><table><tr><th>Ativo</th><th class="n">Qtd</th><th class="n">PM</th><th class="n">Custo total</th></tr>
  ${C.map(x=>`<tr><td><b>${x.t}</b></td><td class="n">${qtd(x.p.q)}</td><td class="n">${S.privado?'••':nf2.format(x.p.pm)}</td><td class="n">${brl(x.p.custo)}</td></tr>`).join('')}</table></div>
  <p class="small muted">Os códigos de ficha seguem a declaração atual e ficam editáveis no app. Confira sempre com o informe de rendimentos da corretora.</p>`;
}
function vMetas(){
  const E=entradas();const ini12=addM(HOJE.slice(0,7),-11);
  const media=E.filter(e=>e.est==='recebido'&&e.pag.slice(0,7)>=ini12).reduce((s,e)=>s+e.liq,0)/12;
  const patr=carteira().reduce((s,c)=>s+c.valor,0);
  const aporte=UI.aporte??1000,dy=UI.dy??9,anos=UI.anos??10;
  let p=patr;for(let i=0;i<anos*12;i++){p=p*(1+dy/100/12)+aporte}
  const rendaFut=p*dy/100/12;const mesesMeta=(()=>{let x=patr,n=0;while(x*dy/100/12<S.cfg.meta&&n<600){x=x*(1+dy/100/12)+aporte;n++}return n})();
  on('#metaV','change',e=>{S.cfg.meta=parseBR(e.target.value)||S.cfg.meta;save();render()});
  on('#simA','change',e=>{UI.aporte=parseBR(e.target.value);render()});on('#simD','change',e=>{UI.dy=parseBR(e.target.value);render()});on('#simN','change',e=>{UI.anos=parseBR(e.target.value);render()});
  const fiis=carteira().filter(c=>c.tipo==='fii');
  return `<h2 style="margin-top:6px">Metas</h2>
  <div class="panel"><label class="f" for="metaV" style="margin-top:0">Meta de renda mensal (R$)</label><input id="metaV" inputmode="decimal" value="${nf2.format(S.cfg.meta)}">
  <p class="small" style="margin:10px 0 0">Hoje: <b class="num">${brl(media)}</b> por mês em média. ${mesesMeta>=600?'Com os parâmetros abaixo, a meta fica acima de 50 anos.':`Com aporte de ${brl(aporte)} e reinvestindo tudo, você chega lá em cerca de <b>${Math.floor(mesesMeta/12)} anos e ${mesesMeta%12} meses</b>.`}</p></div>
  <div class="panel"><h3>Simulador de reinvestimento</h3>
  <div class="grid2"><div><label class="f" for="simA">Aporte mensal (R$)</label><input id="simA" inputmode="decimal" value="${nf2.format(aporte)}"></div><div><label class="f" for="simD">DY médio ao ano (%)</label><input id="simD" inputmode="decimal" value="${nf2.format(dy)}"></div></div>
  <label class="f" for="simN">Anos</label><input id="simN" inputmode="numeric" value="${anos}">
  <div class="grid2" style="margin-top:12px"><div class="kpi"><div class="l">Patrimônio em ${anos} anos</div><div class="v num">${brl(p)}</div></div><div class="kpi"><div class="l">Renda mensal estimada</div><div class="v num">${brl(rendaFut)}</div></div></div>
  <p class="small muted" style="margin-bottom:0">Simulação sem valorização das cotas e sem inflação, só para ordem de grandeza.</p></div>
  <div class="panel"><h3>Número mágico dos FIIs</h3><p class="small muted" style="margin-top:0">Cotas necessárias para o rendimento do mês comprar 1 cota nova sozinho.</p>
  ${fiis.map(f=>{const m=magico(f.t);const pc=Math.min(100,f.q/m*100);return `<div class="row between small" style="margin-top:8px"><b>${f.t}</b><span class="num">${qtd(f.q)} de ${m} cotas</span></div><div class="meta-bar" style="height:7px;margin-top:4px"><i style="width:${pc}%"></i></div>`}).join('')}</div>`;
}
function vConfig(){
  const hr=v=>v?dt(v.slice(0,10))+' '+new Date(v).toTimeString().slice(0,5):'ainda não';
  const fontes=[['Cotações',(S.cfg.brapiToken?'brapi, com reserva no Yahoo':'Yahoo Finance (sem token)'),hr(S.cfg.ultimaCotacao)],['Proventos anunciados e provisionados','Status Invest',hr(S.cfg.ultimosProventos)+((S.cfg.falhaProventos||[]).length?' · sem resposta: '+S.cfg.falhaProventos.slice(0,3).join(', '):'')],['Recebidos, operações e eventos','Extratos da B3 e notas que você importa','—']];
  on('#btnAtualizarTudo','click',()=>{atualizarCotacoes(true);buscarProventosOnline()});
  on('#btnVerAtual','click',()=>verificaAtualizacao(true));
  on('[data-cfg]','change',e=>{const k=e.target.dataset.cfg;S.cfg[k]=e.target.type==='checkbox'?e.target.checked:parseBR(e.target.value);save();toast('Configuração salva. Valores recalculados.');render()});
  // o backup leva todas as carteiras; backups antigos (de uma carteira só) continuam sendo aceitos
  const textoBackup=()=>{if(!S._ro)save();const todas={};META.carteiras.forEach(c=>{todas[c.id]=lerCarteira(c.id)});return JSON.stringify({app:'Aportô',versao:2,gerado:new Date().toISOString(),meta:META,carteiras:todas,dados:S._ro?todas.principal:S})};
  on('#btnBackupArq','click',async()=>{const P=window.HVN;if(NATIVO&&P&&P.Filesystem&&P.Share){try{const nome=`aporto-backup-${HOJE}.json`;const w=await P.Filesystem.writeFile({path:nome,data:textoBackup(),directory:P.Directory.Cache,encoding:P.Encoding.UTF8});await P.Share.share({title:'Backup Aportô',files:[w.uri]});S.cfg.ultimoBackup=new Date().toISOString();save();render()}catch(e){if(!/cancel/i.test(String(e&&e.message)))toast('Não consegui gerar o arquivo. Use a opção de texto.')}return}try{const blob=new Blob([textoBackup()],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`aporto-backup-${HOJE}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);S.cfg.ultimoBackup=new Date().toISOString();save();toast('Backup salvo na pasta Downloads.')}catch(e){toast('Não consegui gerar o arquivo. Use a opção de texto abaixo.')}});
  on('#btnRestArq','click',()=>$('#arqBackup').click());
  on('#arqBackup','change',async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.dados&&!o.carteiras)throw 0;
    const quando=o.gerado?dt(o.gerado.slice(0,10)):'data desconhecida';
    if(o.carteiras&&o.meta){if(!confirm(`Restaurar o backup de ${quando} com ${o.meta.carteiras.length} carteira(s)? Os dados atuais serão substituídos.`))return;
      META.carteiras.forEach(c=>{try{localStorage.removeItem(chaveDe(c.id))}catch(x){}});
      for(const c of o.meta.carteiras){const d=Object.assign(clone(DEF),o.carteiras[c.id]||{});d.cfg=Object.assign(clone(DEF.cfg),(o.carteiras[c.id]||{}).cfg||{});delete d._ro;try{localStorage.setItem(chaveDe(c.id),JSON.stringify(d))}catch(x){}}
      META={carteiras:o.meta.carteiras,ativa:o.meta.carteiras[0].id};salvarMeta();S=lerCarteira(META.ativa);aplicarTema();toast('Backup restaurado.');render();return}
    if(!o.dados.ops)throw 0;if(!confirm(`Restaurar o backup de ${quando} na carteira "${nomeCarteira(META.ativa)}"? Os dados atuais dela serão substituídos.`))return;
    S=Object.assign(clone(DEF),o.dados,{cfg:Object.assign(clone(DEF.cfg),o.dados.cfg||{})});delete S._ro;save();toast('Backup restaurado.');render()}catch(err){toast('Arquivo de backup inválido.')}});
  on('#btnBackup','click',()=>{$('#bkTxt').value=textoBackup();$('#bkBox').classList.remove('hidden')});
  on('#btnCopiar','click',async()=>{try{await navigator.clipboard.writeText($('#bkTxt').value);toast('Backup copiado.')}catch(e){$('#bkTxt').select();toast('Selecionado. Copie com o menu do celular.')}});
  on('#btnRestaurar','click',()=>{try{const o=JSON.parse($('#bkTxt').value);if(!o.dados||!o.dados.ops)throw 0;Object.assign(S,o.dados);save();toast('Backup restaurado.');render()}catch(e){toast('Texto de backup inválido.')}});
  on('#btnReset','click',()=>{if(confirm('Apagar todas as operações, notas e proventos lançados? Gere um backup antes se quiser guardar.')){S=clone(DEF);save();UI.notas=[];render();toast('Todos os dados foram apagados.')}});
  on('#btnSalvarTk','click',()=>{S.cfg.brapiToken=$('#brapiTk').value.trim();save();toast('Token salvo.')});
  on('#btnCotCfg','click',()=>{S.cfg.brapiToken=$('#brapiTk').value.trim();save();atualizarCotacoes()});
  on('#selTema','change',e=>{S.tema=e.target.value;save();aplicarTema()});
  return `<h2 style="margin-top:6px">Configurações</h2>
  ${secaoContaHTML()}
  <div class="panel"><h3>Impostos</h3><p class="small muted" style="margin-top:0">Regras de 2026. Ajuste aqui se a lei mudar, sem esperar versão nova.</p>
  <div class="grid2"><div><label class="f" for="c1">JCP a partir de 2026 (%)</label><input id="c1" data-cfg="jcp" inputmode="decimal" value="${nf2.format(S.cfg.jcp)}"></div><div><label class="f" for="c2">JCP antes de 2026 (%)</label><input id="c2" data-cfg="jcpAnt" inputmode="decimal" value="${nf2.format(S.cfg.jcpAnt)}"></div></div>
  <div class="grid2"><div><label class="f" for="c3">Dividendo: limite mensal por empresa (R$)</label><input id="c3" data-cfg="divLim" inputmode="decimal" value="${nf2.format(S.cfg.divLim)}"></div><div><label class="f" for="c4">Retenção acima do limite (%)</label><input id="c4" data-cfg="divAliq" inputmode="decimal" value="${nf2.format(S.cfg.divAliq)}"></div></div>
  <label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" data-cfg="projecao" ${S.cfg.projecao?'checked':''} style="width:auto"> Mostrar proventos projetados</label></div>
  <div class="panel"><h3>Fontes de dados</h3>${fontes.map(f=>`<div class="row between small" style="padding:7px 0;border-top:1px solid var(--line);gap:10px"><div><b>${f[0]}</b><br><span class="muted">${f[1]}</span></div><div class="right muted">${esc(f[2])}</div></div>`).join('')}
  <p class="small muted">O app atualiza cotações e proventos sozinho ao abrir (no máximo a cada 6 horas). O que você lançou ou importou nunca é sobrescrito.</p>
  <button class="btn sec" id="btnAtualizarTudo">Atualizar agora</button></div>
  <div class="panel"><h3>⬆️ Atualizações</h3><div class="row between small"><span>Versão instalada</span><b>${esc(VERSAO_APP)}</b></div>
  ${(()=>{const pr=localStorage.getItem('hv_upd_pronta');return pr&&cmpVer(pr,VERSAO_APP)>0?`<button class="btn gold full" style="margin-top:8px" onclick="aplicaAtualizacao()">⬆️ Atualizar para ${esc(pr)}</button>`:''})()}
  <p class="small muted">Sempre que você abre o app ele procura a versão mais nova e baixa sozinho. Depois pergunta se quer atualizar na hora — se disser “Agora não”, pergunta de novo na próxima vez. Se saírem várias versões, ele vai direto para a última. Seus dados não são afetados.</p><button class="btn sec full" id="btnVerAtual">🔄 Procurar atualização agora</button></div>
  <div class="panel"><h3>Cotações</h3><p class="small muted" style="margin-top:0">As cotações vêm da brapi, de graça. Crie uma conta em brapi.dev, copie o token e cole aqui. O plano gratuito dá 15 mil consultas por mês, uma por ativo, o que sobra para atualizar a carteira várias vezes por dia.</p>
  <label class="f" for="brapiTk" style="margin-top:0">Token da brapi</label><input id="brapiTk" type="password" autocomplete="off" value="${esc(S.cfg.brapiToken||'')}" placeholder="cole o token aqui">
  <div class="row" style="margin-top:10px"><button class="btn sec" id="btnSalvarTk">Salvar token</button><button class="btn" id="btnCotCfg">Atualizar cotações</button></div>
  ${S.cfg.ultimaCotacao?`<p class="small muted" style="margin-bottom:0">Última atualização: ${dt(S.cfg.ultimaCotacao.slice(0,10))} às ${S.cfg.ultimaCotacao.slice(11,16)} (UTC).</p>`:''}</div>
  <div class="panel"><h3>Aparência</h3><label class="f" for="selTema" style="margin-top:0">Tema</label><select id="selTema"><option value="auto" ${!S.tema||S.tema==='auto'?'selected':''}>Igual ao celular</option><option value="light" ${S.tema==='light'?'selected':''}>Claro</option><option value="dark" ${S.tema==='dark'?'selected':''}>Escuro</option></select><p class="small muted" style="margin-bottom:0">Também dá para alternar pelo ícone de sol e lua no topo.</p></div>
  <div class="panel"><h3>Backup</h3><p class="small muted" style="margin-top:0">${NATIVO?'Gera um arquivo .json com tudo e abre o compartilhar: salve no Drive, em Arquivos, mande por e-mail ou WhatsApp.':''} Gera um arquivo .json com tudo (operações, proventos, eventos, ajustes) na pasta Downloads. Para restaurar em outro celular ou depois de reinstalar, use "Restaurar de arquivo".${S.cfg.ultimoBackup?` Último backup: ${dt(S.cfg.ultimoBackup.slice(0,10))}.`:''}</p>
  <div class="row"><button class="btn" id="btnBackupArq">Baixar backup</button><button class="btn sec" id="btnRestArq">Restaurar de arquivo</button></div>
  <input type="file" id="arqBackup" accept="application/json,.json" class="hidden">
  <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Outras opções</summary>
  <div class="row" style="margin-top:8px"><button class="btn sec" id="btnBackup">Backup como texto</button><button class="btn danger" id="btnReset">Apagar todos os dados</button></div>
  <div id="bkBox" class="hidden" style="margin-top:10px"><textarea id="bkTxt" aria-label="Texto do backup"></textarea><div class="row" style="margin-top:8px"><button class="btn sec" id="btnCopiar">Copiar</button><button class="btn sec" id="btnRestaurar">Restaurar deste texto</button></div></div></details></div>`;
}

/* ===================== SHEET ===================== */
function sheet(html){
  const r=$('#sheetRoot');r.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}<button class="btn sec full" id="sClose" style="margin-top:16px">Fechar</button></div></div>`;
  $('#sbg').onclick=e=>{if(e.target.id==='sbg')r.innerHTML=''};$('#sClose').onclick=()=>r.innerHTML='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheetRoot').innerHTML='';});

function temaEfetivo(){return S.tema&&S.tema!=='auto'?S.tema:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function aplicarTema(){
  if(!S.tema||S.tema==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.tema);
  const escuro=temaEfetivo()==='dark';
  $('#btnTema').innerHTML=escuro
    ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    :'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  $('#btnTema').setAttribute('aria-label',escuro?'Usar tema claro':'Usar tema escuro');$('#btnTema').title=escuro?'Tema claro':'Tema escuro';
}
$('#btnTema').onclick=()=>{S.tema=temaEfetivo()==='dark'?'light':'dark';save();aplicarTema();render()};
if(META.ativa!=='principal'){S=META.ativa==='todas'?consolidar():lerCarteira(META.ativa)}
aplicarTema();
if(!S._ro){try{aplicarConhecidos();incorporarAutomatico()}catch(e){}}
if(NATIVO){
  iniciaNativo();
  const velho=v=>!v||(Date.now()-new Date(v).getTime())>6*3600e3;
  setTimeout(()=>{if(S._ro)return;if(velho(S.cfg.ultimaCotacao)||(pregaoAberto()&&Date.now()-new Date(S.cfg.ultimaCotacao||0).getTime()>5*60e3))atualizarCotacoes(true);iniciarAutoCotacao();if(velho(S.cfg.ultimosProventos))buscarProventosOnline(true)},1500);
}
$('#btnOlho').onclick=()=>{S.privado=!S.privado;save();render()};
$('#btnAtualizar').onclick=()=>{atualizarCotacoes();buscarProventosOnline(true)};
render();
</script>
