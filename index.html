<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aportô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="versao.js"></script>
<script src="plugins.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface2:#E3EAE1; --ink:#14251C; --muted:#5C6B62; --line:#D3DDD2;
  --field:#1F4D3A; --field-ink:#F2F6EF; --grain:#B8901C; --grain-soft:#F1E6C2; --soil:#7A5A3A;
  --ok:#2E7D4F; --warn:#B4541F; --bad:#B3261E;
  --st-rec:#1F4D3A; --st-prov:#B8901C; --st-anun:#7FA38B; --st-proj:#C9D3C8;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1813; --surface:#16231C; --surface2:#1E2E25; --ink:#E6EEE7; --muted:#9AAA9F; --line:#2A3B31;
    --field:#2F6B50; --field-ink:#F2F6EF; --grain:#D9B23E; --grain-soft:#3A3218; --soil:#C79B6D;
    --ok:#6CC08E; --warn:#E39461; --bad:#F08A80;
    --st-rec:#5FA97F; --st-prov:#D9B23E; --st-anun:#3F6B52; --st-proj:#2E3F35;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1813; --surface:#16231C; --surface2:#1E2E25; --ink:#E6EEE7; --muted:#9AAA9F; --line:#2A3B31;
  --field:#2F6B50; --field-ink:#F2F6EF; --grain:#D9B23E; --grain-soft:#3A3218; --soil:#C79B6D;
  --ok:#6CC08E; --warn:#E39461; --bad:#F08A80;
  --st-rec:#5FA97F; --st-prov:#D9B23E; --st-anun:#3F6B52; --st-proj:#2E3F35;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--field)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--field);color:var(--field-ink);padding:12px 16px 12px;display:flex;align-items:center;gap:10px}
.brand{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.iconbtn{background:transparent;border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--grain);outline-offset:2px}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:6px 16px 0}
main{flex:1;padding:12px 16px 96px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;letter-spacing:-.01em;margin:0}
h2{font-size:19px;margin:20px 0 10px}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel + .panel{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* hero */
.hero{background:var(--field);color:var(--field-ink);border-radius:18px;padding:16px 16px 12px;margin-top:4px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:38px;line-height:1.05;margin:2px 0 4px}
.hero .sub{font-size:13px;opacity:.85}
.stalks{display:flex;align-items:flex-end;gap:5px;height:92px;margin-top:14px}
.stalk{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.stalk .b{width:100%;border-radius:6px 6px 2px 2px;min-height:3px;display:flex;flex-direction:column-reverse;overflow:hidden}
.stalk .b i{display:block;width:100%}
.stalk .m{font-size:11px;margin-top:4px;opacity:.8}
.stalk.cur .m{opacity:1;font-weight:600;color:var(--grain-soft)}
.stalk.cur .b{outline:2px solid var(--grain-soft);outline-offset:2px}
.mini{background:none;border:0;padding:2px 4px;font-size:15px;cursor:pointer;line-height:1}
.updbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2F6B50;color:#F2F6EF;font-size:14px;max-width:520px;margin:0 auto}
.pilula{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin:0 0 10px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.heroGrid{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;margin-top:8px}
.heroGrid .hp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.heroGrid b{font-weight:600;margin-left:3px}
.stalk.cur .b{outline:2px solid #F4E2A0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:10px;opacity:.9}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.kpi .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:21px}
.kpi .l{font-size:13px;color:var(--muted)}
.meta-bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:8px}
.meta-bar i{display:block;height:100%;background:var(--grain);border-radius:6px}
/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;font:inherit}
.item:first-child{border-top:0}
button.item{cursor:pointer}
button.item:hover{background:var(--surface2)}
.logo{position:relative;flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;overflow:hidden;background:var(--lc);color:#fff;font:700 10.5px/1 "Bricolage Grotesque",sans-serif;letter-spacing:.02em}
.logo.sm{width:30px;height:30px;border-radius:9px;font-size:9px}
.logo.lg{width:48px;height:48px;border-radius:13px;font-size:12.5px}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.kpi3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpi3 .v{font-size:17px}
.busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.busca:focus-within{border-color:var(--field)}
.busca input{border:0;background:transparent;padding:11px 0;outline:none}
.kpisel{margin-top:6px;padding:5px 8px;font-size:12.5px;border-radius:8px;width:100%;background:var(--surface2);border:0;color:var(--ink)}
.cartbar{padding:10px 16px 0;max-width:520px}
.cartbar button{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13.5px Figtree,sans-serif;cursor:pointer}
.cartbar button:hover{border-color:var(--field)}
.tk{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-rec{background:color-mix(in srgb,var(--st-rec) 18%,transparent);color:var(--st-rec)}
.b-prov{background:color-mix(in srgb,var(--st-prov) 22%,transparent);color:var(--soil)}
.b-anun{background:color-mix(in srgb,var(--st-anun) 25%,transparent);color:var(--ink)}
.b-proj{background:var(--surface2);color:var(--muted)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.flex1{flex:1;min-width:0}
.right{text-align:right}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tabs internos */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13.5px Figtree,sans-serif;padding:8px 10px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* nav inferior */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;color:var(--muted);font:500 11.5px Figtree,sans-serif;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.bottom button[aria-current="page"]{color:var(--field)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.bottom button[aria-current="page"]{color:var(--grain)}}
:root[data-theme="dark"] nav.bottom button[aria-current="page"]{color:var(--grain)}
nav.bottom .selo{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font:700 11px/18px Figtree,sans-serif}
.mi .selo2{background:var(--warn);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
nav.bottom .lancar{width:44px;height:44px;border-radius:14px;background:var(--grain);color:#1b1404;display:grid;place-items:center;margin-top:-6px}
/* formulários */
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 16px;font:600 14.5px Figtree,sans-serif;cursor:pointer;background:var(--field);color:var(--field-ink)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.gold{background:var(--grain);color:#1b1404}
.btn.ghost{background:transparent;color:var(--field);padding:8px 10px}
.btn.danger{background:transparent;color:var(--bad);padding:8px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.drop{position:relative;display:block;border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;background:var(--surface);cursor:pointer;overflow:hidden}
.drop.over,.drop:hover{border-color:var(--field);background:var(--surface2)}
.drop:focus-within{outline:2px solid var(--grain);outline-offset:2px}
.file-over{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
.drop:hover{border-color:var(--field)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:5px 7px;min-width:78px}
.alert{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.alert.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.alert.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.alert.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.alert.info{background:var(--surface2);color:var(--ink)}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
.chart svg{width:100%;height:auto;display:block}
.mi{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mi:first-child{border-top:0}
.mi:hover{background:var(--surface2)}
.mi .ic{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--field)}
.hidden{display:none}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const PROV = genProv();
const EVENTOS0 = [{id:'e1',t:'ITSA4',tipo:'bonificacao',dataEx:'2026-12-01',fator:0.05,custo:1.05,status:'pendente',desc:'Bonificação de 5% (1 ação nova para cada 20), custo atribuído R$ 1,05 por ação'}];

/* ===================== ESTADO ===================== */
const KEY='safra-invest-proto-v2';
const DEF = {ops:[],lotes:[],eventos:[],provB3:[],transf:[],posB3:[],provProv:[],nomes:{},tipos:{},provManual:[],mapa:{},cfg:{jcp:17.5,jcpAnt:15,divLim:50000,divAliq:10,meta:1500,projecao:true},privado:false};
const clone=o=>JSON.parse(JSON.stringify(o));
let S = (()=>{try{
  const v1=localStorage.getItem('safra-invest-proto-v1');
  if(v1&&!localStorage.getItem(KEY)){const o=JSON.parse(v1);const d=clone(DEF);d.ops=(o.ops||[]).filter(x=>x.orig==='nota');d.lotes=o.lotes||[];d.mapa=o.mapa||{};d.nomes=o.nomes||{};localStorage.setItem(KEY,JSON.stringify(d));localStorage.removeItem('safra-invest-proto-v1')}
  const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(clone(DEF),o,{cfg:Object.assign(clone(DEF.cfg),o.cfg||{})})}}catch(e){}return clone(DEF)})();
// ---------- várias carteiras: cada uma guardada separada; "Todas" é a soma, só para consulta ----------
const META_KEY='safra-invest-meta';
let META=(()=>{try{const m=JSON.parse(localStorage.getItem(META_KEY));if(m&&m.carteiras&&m.carteiras.length)return m}catch(e){}return {carteiras:[{id:'principal',nome:'Principal'}],ativa:'principal'}})();
function chaveDe(id){return id==='principal'?KEY:KEY+':'+id}
function salvarMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META))}catch(e){}}
function lerCarteira(id){try{const r=localStorage.getItem(chaveDe(id));if(r){const o=JSON.parse(r);return Object.assign(clone(DEF),o,{cfg:Object.assign(clone(DEF.cfg),o.cfg||{})})}}catch(e){}return clone(DEF)}
function consolidar(){
  const base=lerCarteira('principal');const C=clone(DEF);C.cfg=base.cfg;C.mapa={};C.nomes={};C.tipos={};C.apelidos={};C.cotacoes={};C.privado=base.privado;C.tema=base.tema;
  for(const c of META.carteiras){const d=c.id==='principal'?base:lerCarteira(c.id);
    ['ops','lotes','eventos','provB3','transf','posB3','provProv','provManual'].forEach(k=>C[k]=C[k].concat((d[k]||[]).map(x=>Object.assign({},x,{cart:c.id}))));
    ['mapa','nomes','tipos','cotacoes'].forEach(k=>Object.assign(C[k],d[k]||{}));for(const t in (d.apelidos||{}))C.apelidos[t]=(C.apelidos[t]||[]).concat(d.apelidos[t]);}
  C._ro=true;return C;
}
function nomeCarteira(id){return id==='todas'?'Todas as carteiras':((META.carteiras.find(c=>c.id===id)||{}).nome||'Principal')}
function save(){POSC.clear();if(S._ro)return;try{localStorage.setItem(chaveDe(META.ativa),JSON.stringify(S))}catch(e){}}
function trocarCarteira(id){
  if(!S._ro)save();META.ativa=id;salvarMeta();
  S=id==='todas'?consolidar():lerCarteira(id);

}

    return `<button class="mi" data-trocar="${c.id}"><span class="ic">${c.id===META.ativa?'●':'○'}</span><span class="flex1"><b>${esc(c.nome)}</b><br><span class="small muted">${d.ops.length?`${d.ops.length} operações · ${n} ativos`:'vazia'}</span></span></button>`};
  sheet(`<h3>Carteiras</h3><p class="small muted" style="margin-top:0">Cada carteira tem seus próprios lançamentos, importações e backup. "Todas" soma tudo, só para consulta.</p>
  <div class="list">${META.carteiras.map(linha).join('')}
  ${META.carteiras.length>1?`<button class="mi" data-trocar="todas"><span class="ic">${META.ativa==='todas'?'●':'○'}</span><span class="flex1"><b>Todas as carteiras</b><br><span class="small muted">visão consolidada, somente leitura</span></span></button>`:''}</div>
  <button class="btn gold full" id="btnNovaCart" style="margin-top:12px">+ Nova carteira</button>
  ${META.ativa!=='todas'?`<div class="row" style="margin-top:8px"><button class="btn sec flex1" id="btnRenCart">Renomear "${esc(nomeCarteira(META.ativa))}"</button>${META.ativa!=='principal'?`<button class="btn danger" id="btnDelCart">Excluir</button>`:''}</div>`:''}`);
  document.querySelectorAll('[data-trocar]').forEach(b=>b.onclick=()=>trocarCarteira(b.dataset.trocar));
  document.getElementById('btnNovaCart').onclick=()=>{const nome=(prompt('Nome da nova carteira (ex.: Aposentadoria, Esposa, Filhos):')||'').trim();if(!nome)return;
    const id='c'+Date.now().toString(36);const nova=clone(DEF);const base=S._ro?lerCarteira('principal'):S;nova.cfg=Object.assign(clone(DEF.cfg),{brapiToken:base.cfg.brapiToken,jcp:base.cfg.jcp,jcpAnt:base.cfg.jcpAnt,divLim:base.cfg.divLim,divAliq:base.cfg.divAliq});nova.tema=base.tema;
    try{localStorage.setItem(chaveDe(id),JSON.stringify(nova))}catch(e){}META.carteiras.push({id,nome});salvarMeta();trocarCarteira(id)};
  const ren=document.getElementById('btnRenCart');if(ren)ren.onclick=()=>{const c=META.carteiras.find(c=>c.id===META.ativa);const nome=(prompt('Novo nome:',c.nome)||'').trim();if(!nome)return;c.nome=nome;salvarMeta();$('#sheetRoot').innerHTML='';render()};
  const del=document.getElementById('btnDelCart');if(del)del.onclick=()=>{const nome=nomeCarteira(META.ativa);if(!confirm(`Excluir a carteira "${nome}" e todos os lançamentos dela? Isso não tem volta (faça um backup antes, se quiser).`))return;
    try{localStorage.removeItem(chaveDe(META.ativa))}catch(e){}META.carteiras=META.carteiras.filter(c=>c.id!==META.ativa);META.ativa='principal';salvarMeta();S=lerCarteira('principal');$('#sheetRoot').innerHTML='';render();toast('Carteira excluída.')};
}
const UI = {tab:'inicio',sub:{proventos:'receber',carteira:'todos',lancar:'importar',mais:null},notas:[],notaAberta:null,lendo:null,senha:''};

/* ===================== FORMATAÇÃO ===================== */
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=v=>S.privado?'R$ ••••':'R$ '+nf2.format(v||0);
const pct=v=>S.privado?'••%':nf2.format(v||0)+'%';
const qtd=v=>S.privado?'••':new Intl.NumberFormat('pt-BR').format(v);
const dt=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const dtc=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const mLbl=ym=>MESES[Number(ym.slice(5))-1];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseBR=s=>Number(String(s).replace(/\./g,'').replace(',','.'))||0;
const TIPO_LBL={dividendo:'Dividendo',jcp:'JCP',rendimento:'Rendimento',amortizacao:'Amortização'};
const EST_LBL={recebido:'Recebido',provisionado:'Provisionado',anunciado:'Anunciado',projetado:'Projetado'};
const EST_CLS={recebido:'b-rec',provisionado:'b-prov',anunciado:'b-anun',projetado:'b-proj'};
const LOGO_FALHA=new Set();
function logo(t,tam=''){
  let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))%360;
  const fii=/11$/.test(t)&&ativo(t).tipo==='fii';
  const cor=`hsl(${h} ${fii?35:45}% ${fii?34:38}%)`;
  const img=LOGO_FALHA.has(t)?'':`<img src="https://icons.brapi.dev/icons/${t}.svg" alt="" loading="lazy" onerror="LOGO_FALHA.add('${t}');this.remove()">`;
  return `<span class="logo ${tam}" style="--lc:${cor}" aria-hidden="true">${t.replace(/\d+$/,'')}${img}</span>`;
}
// cotação: online (brapi) ou corrigida por você; sem isso, mostra o último preço pago e avisa
function cotacaoDe(t){const c=(S.cotacoes||{})[t];if(c)return c;const u=S.ops.filter(o=>o.t===t).sort((a,b)=>a.d<b.d?1:-1)[0];return u?{p:u.p,d:u.d,fonte:'ultima'}:{p:0,d:null,fonte:'nenhuma'}}
function cotAtual(c){return c.fonte==='brapi'||c.fonte==='yahoo'||c.fonte==='manual'}
function ativo(t){const b=ATIVOS[t]||{};const fii=(S.tipos&&S.tipos[t])?S.tipos[t]==='fii':(b.tipo?b.tipo==='fii':/11$/.test(t));const c=cotacaoDe(t);
  return {nome:(S.nomes&&S.nomes[t])||b.nome||t,tipo:fii?'fii':'acao',setor:b.setor||(fii?'FII (a classificar)':'Ações (a classificar)'),cnpj:b.cnpj||'—',cot:c.p,cotFonte:c.fonte,cotData:c.d}}
// proventos por cota nos últimos 12 meses (dados da B3; um pagamento por data, mesmo se dividido entre corretoras)
function provPorCota12m(t){const ini=addM(HOJE.slice(0,7),-11);
  const b3=(S.provB3||[]).filter(p=>p.t===t&&p.pag.slice(0,7)>=ini&&p.pag<=HOJE&&p.tipo!=='amortizacao');
  if(b3.length){const vis=new Set();let s=0;for(const p of b3){const v=p.vUnit||(p.q?p.liq/p.q:0);const k=p.pag+'|'+p.tipo+'|'+v.toFixed(6);if(vis.has(k))continue;vis.add(k);s+=v}return s}
  return PROV.filter(p=>p.t===t&&p.pag.slice(0,7)>=ini&&p.pag<=HOJE).reduce((s,p)=>s+p.v,0)}
function ultimoRendimento(t){const b=(S.provB3||[]).filter(p=>p.t===t&&p.tipo==='rendimento'&&p.vUnit).sort((a,b)=>a.pag<b.pag?-1:1);if(b.length)return b[b.length-1];const h=PROV.filter(p=>p.t===t).sort((a,b)=>a.com<b.com?-1:1);const u=h[h.length-1];return u?{vUnit:u.v,pag:u.pag}:null}
async function cotacaoYahoo(t){
  const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}.SA?range=1d&interval=1d`,{headers:{'User-Agent':'Mozilla/5.0'}});
  if(!r.ok)throw new Error(r.status);const j=await r.json();const m=j.chart&&j.chart.result&&j.chart.result[0]&&j.chart.result[0].meta;
  if(!m||m.regularMarketPrice==null)throw new Error('sem preço');
  return {p:m.regularMarketPrice,d:new Date((m.regularMarketTime||Date.now()/1000)*1000).toISOString().slice(0,10),h:new Date().toISOString(),fonte:'yahoo',pc:m.chartPreviousClose??m.previousClose??null};
}
async function cotacaoBrapi(t,tk){
  const r=await fetch(`https://brapi.dev/api/quote/${encodeURIComponent(t)}?token=${encodeURIComponent(tk)}`);
  if(!r.ok)throw new Error(r.status);const j=await r.json();const q=j.results&&j.results[0];
  if(!q||q.regularMarketPrice==null)throw new Error('sem preço');
  return {p:q.regularMarketPrice,d:String(q.regularMarketTime||new Date().toISOString()).slice(0,10),h:new Date().toISOString(),fonte:'brapi',pc:q.regularMarketPreviousClose??(q.regularMarketChange!=null?q.regularMarketPrice-q.regularMarketChange:null)};
}
async function atualizarCotacoes(silencioso,auto){
  const tk=(S.cfg.brapiToken||'').trim(); const L=carteira().map(c=>c.t);
  if(!L.length){if(!silencioso)toast('Sua carteira está vazia.');return}
  S.cotacoes=S.cotacoes||{};let ok=0;const falha=[];const fila=[...L];
  if(!silencioso)toast(`Buscando ${L.length} cotações…`);
  const trab=async()=>{while(fila.length){const t=fila.shift();try{
    let c=null;if(tk){try{c=await cotacaoBrapi(t,tk)}catch(e){}}
    if(!c)c=await cotacaoYahoo(t);
    S.cotacoes[t]=c;ok++;
  }catch(e){falha.push(t)}}};
  await Promise.all([trab(),trab(),trab()]);
  S.cfg.ultimaCotacao=new Date().toISOString();save();
  if(!auto||(['inicio','carteira'].includes(UI.tab)&&!$('#sheetRoot').innerHTML&&!(document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input,textarea,select'))))render();
  if(!auto&&(!silencioso||!ok))toast(ok?`${ok} cotações atualizadas${falha.length?`; sem resposta: ${falha.slice(0,4).join(', ')}${falha.length>4?'…':''}`:''}.`:(NATIVO?'Não consegui buscar as cotações. Confira a internet.':'No navegador a busca é bloqueada; no app ela funciona.'));
}

// ---------- variação do dia (cotação atual × fechamento anterior) ----------
function variacaoDia(t){const c=(S.cotacoes||{})[t];if(!c||!c.pc||!cotAtual(c))return null;const q=pos(t,HOJE).q;return {pct:(c.p/c.pc-1)*100,val:q*(c.p-c.pc),base:q*c.pc,d:c.d,h:c.h}}
function variacaoCarteira(){let val=0,base=0,n=0,d='',h='';for(const c of carteira()){const v=variacaoDia(c.t);if(!v)continue;val+=v.val;base+=v.base;n++;if(v.d>d)d=v.d;if((v.h||'')>h)h=v.h||''}return n?{val,pct:base?val/base*100:0,n,d,h}:null}
function rotuloDia(d){return d&&d<HOJE?'último pregão ('+dt(d).slice(0,5)+')':'hoje'}
function sinal(v){return v>=0?'+':'−'}
function linhaHoje(){const v=variacaoCarteira();if(!v)return '';const cor=v.val>=0?'var(--ok)':'var(--bad)';const r=rotuloDia(v.d);return `<div class="row between small" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="muted">Variação ${r}${v.h&&v.d>=HOJE?' · '+new Date(v.h).toTimeString().slice(0,5):''}</span><b class="num" style="color:${cor}">${v.val>=0?'▲':'▼'} ${sinal(v.val)}${brl(Math.abs(v.val))} (${sinal(v.val)}${nf2.format(Math.abs(v.pct))}%)</b></div>`}

function eventosVisiveis(){return S.eventos.filter(e=>e.status==='aplicado'||S.ops.some(o=>o.t===e.t&&o.d<=e.dataEx))}
function eventosAplicados(){return S.eventos.filter(e=>e.status==='aplicado')}
function irDe(p,bruto){
  if(p.tipo==='jcp') return bruto*((p.com<'2026-01-01'?S.cfg.jcpAnt:S.cfg.jcp)/100);
  if(p.tipo==='dividendo' && !p.lucro2025 && bruto>S.cfg.divLim) return bruto*S.cfg.divAliq/100;
  return 0;
}
function estado(p){return p.pag<=HOJE?'recebido':p.com<=HOJE?'provisionado':'anunciado'}

let POSC=new Map();
const PRIO={incorporacao:0,resgate:1};
function diaAntes(d){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-1);return x.toISOString().slice(0,10)}
function somaDias(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function pos(t,ate){
  const ck=t+'|'+ate; if(POSC.has(ck)) return POSC.get(ck);
  const mov=[];
  S.ops.filter(o=>o.t===t&&o.d<=ate).forEach(o=>mov.push({d:o.d,k:0,o}));
  eventosAplicados().filter(e=>(e.t===t||e.para===t)&&e.dataEx<=ate).forEach(e=>mov.push({d:e.dataEx,k:1,p:PRIO[e.tipo]??5,e}));
  mov.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.k-b.k||(a.p??0)-(b.p??0));
  let q=0,custo=0,res=0;
  for(const m of mov){
    if(m.o){const o=m.o;
      if(o.tipo==='C'){custo+=o.q*o.p+(o.c||0);q+=o.q}
      else{const pm=q?custo/q:0;res+=o.q*o.p-(o.c||0)-o.q*pm;custo-=o.q*pm;q-=o.q}
    }else{const e=m.e;const pm=q?custo/q:0;
      switch(e.tipo){
        case 'desdobramento': q=q*e.fator;break;
        case 'grupamento': q=Math.floor(q/e.fator);break;
        case 'bonificacao': {const n=Math.floor(q*e.fator);q+=n;custo+=n*e.custo;break}
        case 'bonif_qtd': q+=e.q;custo+=e.q*(e.custo||0);break;
        case 'desdobro_qtd': q+=e.q;break;
        case 'grupamento_qtd': q-=e.q;break;
        case 'subscricao': q+=e.q;custo+=e.q*(e.preco||0);break;
        case 'cisao_qtd': q+=e.q;custo+=(e.custo||0);break;
        case 'fracao': {const fq=e.q>0?e.q:Math.round((q-Math.floor(q+1e-9))*1e6)/1e6;custo-=fq*pm;res+=(e.valor||0)-fq*pm;q-=fq;break}
        case 'amortizacao': custo=Math.max(0,custo-(e.valor||0));break;
        case 'resgate': {if(e.incorporadoEm&&q<=1e-9)break;const rq=Math.min(e.q,Math.max(q,0));custo-=rq*pm;if(!e.incorporadoEm)res+=(e.valor||0)-rq*pm;q-=e.incorporadoEm?rq:e.q;break}
        case 'baixa': res-=custo;q=0;custo=0;break;
        case 'ajuste_pm': if(q>1e-9)custo=q*e.pm;break;
        case 'incorporacao':
          if(e.t===t&&e.para!==t){q=0;custo=0}
          else if(e.para===t){const ant=pos(e.t,diaAntes(e.dataEx));q+=e.qPara;custo+=Math.max(0,ant.custo-(e.caixa||0))}
          break;
      }
      if(Math.abs(q)<1e-9){q=0;custo=0}
    }
  }
  const r={q:Math.round(q*1e6)/1e6,custo,pm:q>1e-9?custo/q:0,res};
  POSC.set(ck,r); return r;
}
function carteira(){
  return tickers().map(t=>{const p=pos(t,HOJE);const a=ativo(t);return Object.assign({t},a,p,{valor:p.q*a.cot})}).filter(x=>x.q>1e-6);
}
function tickers(){const s=new Set(S.ops.map(o=>o.t));eventosAplicados().forEach(e=>{s.add(e.t);if(e.para)s.add(e.para)});return [...s].sort()}
function aliqJcp(p){
  if(p.vUnit&&p.q){const r=1-p.liq/(p.q*p.vUnit);return Math.abs(r-0.175)<Math.abs(r-0.15)?0.175:0.15}
  return p.pag<'2026-01-01'?0.15:0.175;
}
function provB3Entradas(){
  return (S.provB3||[]).map(p=>{let bruto=p.liq,ir=0;if(p.tipo==='jcp'){const a=aliqJcp(p);bruto=p.liq/(1-a);ir=bruto-p.liq}
    return {id:p.key,t:p.t,tipo:p.tipo,v:p.vUnit||(p.q?bruto/p.q:0),com:p.pag,pag:p.pag,q:p.q,bruto,ir,liq:p.liq,est:p.pag<=HOJE?'recebido':'provisionado',fonte:'B3',corretora:p.corretora,b3:true}});
}

function tipoProvento(et){const s=String(et||'').toLowerCase();return /jcp|juros/.test(s)?'jcp':/rend/.test(s)?'rendimento':/amort/.test(s)?'amortizacao':'dividendo'}
async function proventosDe(t,tipo){
  const rotas=tipo==='fii'?['fii','acao']:['acao','fii'];
  for(const r of rotas){
    try{const res=await fetch(`https://statusinvest.com.br/${r}/companytickerprovents?ticker=${encodeURIComponent(t)}&chartProventsType=2`,{headers:{'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36','Accept':'application/json, text/plain, */*','X-Requested-With':'XMLHttpRequest'}});
      if(!res.ok)continue;const j=await res.json();const arr=(j&&(j.assetEarningsModels||j.models))||[];if(!arr.length)continue;
      return arr.map(x=>({tipo:tipoProvento(x.et||x.etd),com:dataBR(x.ed),pag:dataBR(x.pd),v:Number(String(x.v??x.sv??0).replace(',','.'))})).filter(x=>x.com&&x.v>0);
    }catch(e){}
  }
  throw new Error('sem dados');
}
async function buscarProventosOnline(silencioso){
  const C=carteira();if(!C.length)return;
  S.provOnline=S.provOnline||{};let ok=0;const falha=[];const fila=[...C];
  const trab=async()=>{while(fila.length){const c=fila.shift();try{const itens=await proventosDe(c.t,c.tipo);S.provOnline[c.t]={d:new Date().toISOString(),itens};ok++}catch(e){falha.push(c.t)}}};
  await Promise.all([trab(),trab(),trab()]);
  S.cfg.ultimosProventos=new Date().toISOString();S.cfg.falhaProventos=falha;save();render();
  if(!silencioso)toast(ok?`Proventos de ${ok} ativos atualizados${falha.length?`; sem resposta: ${falha.slice(0,4).join(', ')}`:''}.`:(NATIVO?'Não consegui buscar os proventos agora.':'No navegador a busca é bloqueada; no app ela funciona.'));
}
function provOnlineEntradas(base){
  const out=[];const ini=somaDias(HOJE,-400);
  for(const t in (S.provOnline||{})){
    const itens=S.provOnline[t].itens||[];const ultB3=base.filter(b=>b.t===t&&b.b3&&b.est==='recebido').map(b=>b.pag).sort().pop()||'';
    for(const p of itens){
      if(p.com<ini)continue;
      if(p.pag&&p.pag<=ultB3)continue;
      if(base.some(b=>b.t===t&&b.tipo===p.tipo&&p.pag&&Math.abs(new Date(b.pag)-new Date(p.pag))<=5*864e5))continue;
      const q=pos(t,p.com).q;if(q<=0)continue;
      const bruto=q*p.v;const ir=irDe({tipo:p.tipo,com:p.com},bruto);const pag=p.pag||somaDias(HOJE,60);
      const est=p.com>HOJE?'anunciado':(p.pag&&p.pag<=HOJE?'recebido':'provisionado');
      out.push({id:'on|'+t+'|'+p.com+'|'+p.tipo+'|'+p.v,t,tipo:p.tipo,v:p.v,com:p.com,pag,semData:!p.pag,q,bruto,ir,liq:bruto-ir,est,fonte:'Status Invest'+(est==='recebido'?' (a confirmar pela B3)':'')});
    }
  }
  return out;
}

async function glInit(){if(_glInit)return;if(!GOOGLE_WEB_CLIENT)throw new Error('login Google ainda não configurado');await HVN.SocialLogin.initialize({google:{webClientId:GOOGLE_WEB_CLIENT,mode:'online'}});_glInit=true;}
async function googleLogin(silencioso){await glInit();
  const r=await HVN.SocialLogin.login({provider:'google',options:{scopes:[DRIVE_SCOPE],...(silencioso?{filterByAuthorizedAccounts:true,autoSelectEnabled:true}:{forcePrompt:false})}});
  const res=r&&r.result||{};const at=res.accessToken&&res.accessToken.token;if(at){_tok=at;_tokExp=Date.now()+50*60e3;}
  return{email:res.profile&&res.profile.email,nome:res.profile&&res.profile.name,foto:res.profile&&res.profile.imageUrl,token:at};}
async function tokenDrive(){if(_tok&&Date.now()<_tokExp)return _tok;const r=await googleLogin(true);if(!r.token)throw new Error('sem-token');return r.token;}
async function gapi(url,opt={},tentou){const t=await tokenDrive();const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});
  if(r.status===401&&!tentou){_tok=null;return gapi(url,opt,true);}if(!r.ok)throw new Error('drive '+r.status+' '+(await r.text()).slice(0,200));return r;}

// ---------- Drive ----------
async function pastaDrive(){if(C.drive&&C.drive.pasta){if(!C.drive.renomeada){try{await gapi(`https://www.googleapis.com/drive/v3/files/${C.drive.pasta}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:PASTA_DRIVE})});C.drive.renomeada=true;salvaConta();}catch(e){}}return C.drive.pasta;}
  const q=encodeURIComponent(`(${[PASTA_DRIVE,...PASTAS_ANTIGAS].map(n=>`name='${n}'`).join(' or ')}) and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`)).json();
  let id=l.files&&l.files[0]&&l.files[0].id;
  if(!id){const c=await (await gapi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:PASTA_DRIVE,mimeType:'application/vnd.google-apps.folder'})})).json();id=c.id;}
  C.drive=Object.assign(C.drive||{},{pasta:id});salvaConta();if(l.files&&l.files[0]&&l.files[0].name!==PASTA_DRIVE)return pastaDrive();C.drive.renomeada=true;salvaConta();return id;}

function aplicarBackupTodas(o){
  if(o.carteiras&&o.meta){META.carteiras.forEach(c=>{try{localStorage.removeItem(chaveDe(c.id))}catch(x){}});
    for(const c of o.meta.carteiras){const d=Object.assign(clone(DEF),o.carteiras[c.id]||{});d.cfg=Object.assign(clone(DEF.cfg),(o.carteiras[c.id]||{}).cfg||{});delete d._ro;try{localStorage.setItem(chaveDe(c.id),JSON.stringify(d))}catch(x){}}
    META={carteiras:o.meta.carteiras,ativa:o.meta.carteiras[0].id};salvarMeta();S=lerCarteira(META.ativa);}
  else if(o.dados&&o.dados.ops){S=Object.assign(clone(DEF),o.dados,{cfg:Object.assign(clone(DEF.cfg),o.dados.cfg||{})});delete S._ro;save();}
  else throw new Error('arquivo inválido');

async function backupDrive(manual){if(!NATIVO||!temGoogle())return;if(!navigator.onLine){if(manual)toast('Sem internet agora — o backup será feito depois');return;}
  try{if(manual)toast('Enviando backup para o Google Drive…');const pasta=await pastaDrive(),d=new Date();
    const nome=`Aporto-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}h${pad2(d.getMinutes())}.json`;
    const b='hv'+Date.now(),meta={name:nome,parents:[pasta],mimeType:'application/json'};
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(dadosBackupTodas())}\r\n--${b}--`;
    await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    C.drive=Object.assign(C.drive||{},{ultimo:Date.now(),arquivo:nome,erro:null});salvaConta();if(manual)toast('✓ Backup salvo no Drive');limpaAntigos().catch(()=>{});
    if(UI.tab==='mais')render();}
  catch(e){C.drive=Object.assign(C.drive||{},{erro:String(e.message||e).slice(0,120)});if(String(e.message).includes('404'))C.drive.pasta=null;salvaConta();
    if(manual)toast('Não consegui salvar no Drive. Tente de novo.');}}

async function limpaAntigos(){const f=await listaBackups();for(const x of f.slice(40))await gapi(`https://www.googleapis.com/drive/v3/files/${x.id}`,{method:'DELETE'});}
async function abrirRestaurar(){sheet(`<h3>Restaurar do Google Drive</h3><p class="muted">Buscando seus backups…</p>`);

async function restauraDrive(id,quando){if(!confirm(`Restaurar o backup de ${new Date(quando).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}? Os dados atuais deste celular serão substituídos.`))return;

function provProvEntradas(base){
  return (S.provProv||[]).filter(p=>!base.some(b=>b.t===p.t&&b.tipo===p.tipo&&p.pag&&Math.abs(new Date(b.pag)-new Date(p.pag))<=5*864e5)).map(p=>{
    let bruto=p.liq,ir=0;if(p.tipo==='jcp'){const a=aliqJcp(Object.assign({},p,{pag:p.pag||HOJE}));bruto=p.liq/(1-a);ir=bruto-p.liq}
    const pag=p.pag||somaDias(HOJE,90);
    return {id:p.key,t:p.t,tipo:p.tipo,v:p.vUnit||(p.q?bruto/p.q:0),com:p.pag||HOJE,pag,semData:!p.pag,q:p.q,bruto,ir,liq:p.liq,est:p.pag&&p.pag<HOJE?'recebido':'provisionado',fonte:'B3 (provisionado)',corretora:p.corretora,b3:true}});
}
function entradas(){
  const out=provB3Entradas(); out.push(...provProvEntradas(out)); out.push(...provOnlineEntradas(out));
  const ultB3={};out.forEach(e=>{if(!ultB3[e.t]||e.pag>ultB3[e.t])ultB3[e.t]=e.pag});
  for(const p of todosProv()){
    if(ultB3[p.t]||(S.provOnline||{})[p.t]) continue; // ativo com dados reais: não usa proventos de exemplo
    const q=p.qtdFixa??pos(p.t,p.com).q; if(q<=0) continue;
    const bruto=p.brutoFixo??q*p.v; const ir=p.irFixo??irDe(p,bruto);
    out.push(Object.assign({},p,{q,bruto,ir,liq:bruto-ir,est:estado(p)}));
  }
  if(S.cfg.projecao) out.push(...projecoes(out));
  return out.sort((a,b)=>a.pag<b.pag?-1:1);
}
function projecoes(reais){
  const out=[]; const lim=addM(HOJE.slice(0,7),12);
  for(const c of carteira()){
    let hist=reais.filter(r=>r.t===c.t&&r.est!=='projetado'&&r.tipo!=='amortizacao').map(r=>({id:r.id,t:r.t,tipo:r.tipo,v:r.v,com:r.com,pag:r.pag}));
    if(!hist.length) hist=PROV.filter(p=>p.t===c.t);
    hist.sort((a,b)=>a.pag<b.pag?-1:1);
    if(!hist.length) continue;
    const ultimoPag=hist[hist.length-1].pag;
    if(c.tipo==='fii'){
      const ult=hist.slice(-6); const media=ult.reduce((s,p)=>s+p.v,0)/ult.length; const dia=ultimoPag.slice(8,10);
      let ym=addM(ultimoPag.slice(0,7),1);
      while(ym<=lim){
        const pag=ym+'-'+(Number(dia)>28?'28':dia);
        if(pag>HOJE) out.push({id:'pj'+c.t+ym,t:c.t,tipo:'rendimento',v:media,com:pag,pag,q:c.q,bruto:c.q*media,ir:0,liq:c.q*media,est:'projetado',fonte:'Média dos últimos 6'});
        ym=addM(ym,1);
      }
    }else{
      const ano=hist.filter(p=>p.pag>addM(HOJE.slice(0,7),-12)+'-31'&&p.pag<=HOJE);
      for(const p of ano){
        const pag=(Number(p.pag.slice(0,4))+1)+p.pag.slice(4); const com=(Number(p.com.slice(0,4))+1)+p.com.slice(4);
        if(pag<=HOJE||pag.slice(0,7)>lim) continue;
        const perto=reais.some(r=>r.t===p.t&&r.tipo===p.tipo&&r.pag>HOJE&&Math.abs(new Date(r.pag)-new Date(pag))<50*864e5);
        if(perto) continue;
        const bruto=c.q*p.v; const ir=p.tipo==='jcp'?bruto*S.cfg.jcp/100:0;
        out.push({id:'pj'+p.id,t:p.t,tipo:p.tipo,v:p.v,com,pag,q:c.q,bruto,ir,liq:bruto-ir,est:'projetado',fonte:'Repete o último ano'});
      }
    }
  }
  return out;
}
function porMes(E){const m={};for(const e of E){const k=e.pag.slice(0,7);(m[k]=m[k]||{recebido:0,provisionado:0,anunciado:0,projetado:0})[e.est]+=e.liq}return m}

// ---------- Lucro total: valorização da carteira + vendas já realizadas + proventos recebidos ----------
function lucroTotal(){
  const E=entradas().filter(e=>e.est==='recebido');
  const provT={};E.forEach(e=>provT[e.t]=(provT[e.t]||0)+e.liq);
  const C=carteira();const emCart=new Set(C.map(c=>c.t));
  const L={};const linha=t=>L[t]=L[t]||{t,val:0,vendas:0,prov:0,aplicado:0,emCart:emCart.has(t)};
  C.forEach(c=>{const r=linha(c.t);r.val=c.valor-c.custo;r.aplicado=c.custo});
  tickers().forEach(t=>{const res=pos(t,HOJE).res;if(Math.abs(res)>0.004)linha(t).vendas=res});
  Object.entries(provT).forEach(([t,v])=>{linha(t).prov=v});
  const lista=Object.values(L).map(r=>Object.assign(r,{total:r.val+r.vendas+r.prov})).sort((a,b)=>b.total-a.total);
  const soma=k=>lista.reduce((s,r)=>s+r[k],0);
  const aplicado=C.reduce((s,c)=>s+c.custo,0);
  return {val:soma('val'),vendas:soma('vendas'),prov:soma('prov'),total:soma('total'),aplicado,lista,semCot:C.filter(c=>!cotAtual(cotacaoDe(c.t))).length,
    provCart:lista.filter(r=>r.emCart).reduce((s,r)=>s+r.prov,0),provVend:lista.filter(r=>!r.emCart).reduce((s,r)=>s+r.prov,0)};
}
function lucroPainel(){

  const item=(ic,tit,sub,v)=>`<div style="margin:10px 0"><div class="row between"><div><span aria-hidden="true">${ic}</span> <b>${tit}</b><div class="small muted">${sub}</div></div><b class="num" style="color:${cor(v)}">${sin(v)}</b></div><div class="meta-bar" style="height:6px;margin-top:5px"><i style="width:${Math.abs(v)/mx*100}%;background:${v>=0?(ic==='🌾'?'var(--grain)':'var(--ok)'):'var(--bad)'}"></i></div></div>`;

function reabrirAtivo(t){save();POSC.clear();render();abrirAtivo(t);setTimeout(()=>{const h=document.getElementById('histAtivo');if(h)h.scrollIntoView()},50)}
function editarLanc(t,k,id){

    sheet(`<h3>Editar ajuste de preço médio · ${t}</h3>

    document.getElementById('edOk').onclick=()=>{const v=parseBR(document.getElementById('edPm').value),d=document.getElementById('edD').value;if(!v||!d){toast('Preencha o preço médio e a data.');return}
      e.pm=v;e.dataEx=d;e.desc=`Preço médio ajustado para R$ ${nf2.format(v)}`;reabrirAtivo(t);toast('Ajuste atualizado. Preço médio recalculado.')};return;}
  const o=S.ops.find(x=>x.id===id);if(!o)return;
  sheet(`<h3>Editar lançamento · ${t}</h3>
  <div class="grid2"><div><label class="f" for="edTipo">Operação</label><select id="edTipo"><option value="C" ${o.tipo==='C'?'selected':''}>Compra</option><option value="V" ${o.tipo==='V'?'selected':''}>Venda</option></select></div>
  <div><label class="f" for="edD">Data</label><input id="edD" type="date" value="${o.d}"></div></div>
  <div class="grid2"><div><label class="f" for="edQ">Quantidade</label><input id="edQ" inputmode="decimal" value="${String(o.q).replace('.',',')}"></div>
  <div><label class="f" for="edP">Preço (R$)</label><input id="edP" inputmode="decimal" value="${nf2.format(o.p)}"></div></div>
  <label class="f" for="edC">Custos (R$)</label><input id="edC" inputmode="decimal" value="${nf2.format(o.c||0)}">
  <div class="row" style="margin-top:14px"><button class="btn sec" onclick="abrirAtivo('${t}')">Cancelar</button><button class="btn gold flex1" id="edOk">Salvar</button></div>`);
  document.getElementById('edOk').onclick=()=>{const tipo=document.getElementById('edTipo').value,d=document.getElementById('edD').value,q=parseBR(document.getElementById('edQ').value),pr=parseBR(document.getElementById('edP').value),c=parseBR(document.getElementById('edC').value);
    if(!d||!q||!pr){toast('Preencha data, quantidade e preço.');return}
    const bak=Object.assign({},o);Object.assign(o,{tipo,d,q,p:pr,c});POSC.clear();
    if(tipo==='V'&&pos(t,d).q<-1e-6){Object.assign(o,bak);POSC.clear();toast('Essa venda deixaria a posição negativa nessa data.');return}
    reabrirAtivo(t);toast('Lançamento atualizado. Preço médio recalculado.')};}
function excluirLanc(t,k,id){
  if(k==='ev'){const e=S.eventos.find(x=>x.id===id);if(!e)return;
    if(!confirm(`Excluir o ajuste de preço médio de ${dt(e.dataEx)} (R$ ${nf2.format(e.pm)})? O preço médio volta a ser calculado sem ele.`))return;

  const o=S.ops.find(x=>x.id===id);if(!o)return;
  if(!confirm(`Excluir a ${o.tipo==='C'?'compra':'venda'} de ${qtd(o.q)} ${t} em ${dt(o.d)} a R$ ${nf2.format(o.p)}?`))return;
  S.ops=S.ops.filter(x=>x.id!==id);if(o.lote&&!S.ops.some(x=>x.lote===o.lote)&&!S.eventos.some(x=>x.lote===o.lote))S.lotes=S.lotes.filter(l=>l.id!==o.lote);

function contaMovs(t){return S.ops.filter(o=>o.t===t).length+eventosAplicados().filter(e=>e.t===t||e.para===t).length}
function historicoAtivo(t){
  const ORIG={b3:'B3',nota:'Nota',manual:'Manual',saldo:'Saldo anterior'};
  const L=[];
  S.ops.filter(o=>o.t===t).forEach(o=>L.push({d:o.d,ev:o.tipo==='C'?'Compra':'Venda',q:o.tipo==='C'?o.q:-o.q,val:'R$ '+nf2.format(o.p),c:o.c||0,orig:(ORIG[o.orig]||'Manual')+(o.notaLote||o.conferidoB3?' + nota':''),ed:(o.orig==='manual'||o.orig==='saldo'||!o.orig)?{k:'op',id:o.id}:null}));
  eventosAplicados().filter(e=>e.t===t||e.para===t).forEach(e=>{
    const ant=pos(t,diaAntes(e.dataEx)).q; const r={d:e.dataEx,c:0,orig:e.origem||'Manual',val:'',ed:(e.tipo==='ajuste_pm'||e.origem==='Manual')?{k:'ev',id:e.id}:null};
    switch(e.tipo){
      case 'bonif_qtd': Object.assign(r,{ev:'Bonificação',q:e.q,val:e.custo!=null?'custo R$ '+nf2.format(e.custo):'custo pendente'});break;
      case 'bonificacao': Object.assign(r,{ev:'Bonificação',q:Math.floor(ant*e.fator),val:'custo R$ '+nf2.format(e.custo||0)});break;
      case 'desdobro_qtd': Object.assign(r,{ev:'Desdobramento',q:e.q});break;
      case 'desdobramento': Object.assign(r,{ev:'Desdobramento',q:ant*(e.fator-1)});break;
      case 'grupamento_qtd': Object.assign(r,{ev:'Grupamento',q:-e.q});break;
      case 'grupamento': Object.assign(r,{ev:'Grupamento',q:Math.floor(ant/e.fator)-ant});break;
      case 'subscricao': Object.assign(r,{ev:'Subscrição',q:e.q,val:e.preco!=null?'R$ '+nf2.format(e.preco)+(e.estimado?' (est.)':''):'preço pendente'});break;
      case 'fracao': {const fq=e.q>0?e.q:Math.round((ant-Math.floor(ant+1e-9))*1e6)/1e6;Object.assign(r,{ev:'Fração para leilão',q:-fq,val:e.valor?'recebeu R$ '+nf2.format(e.valor):''});break}
      case 'amortizacao': Object.assign(r,{ev:'Amortização',q:0,val:'R$ '+nf2.format(e.valor||0)});break;
      case 'resgate': Object.assign(r,{ev:e.incorporadoEm?'Resgate (parte da incorporação em '+e.incorporadoEm+')':'Resgate',q:-Math.min(e.q,Math.max(ant,0)),val:'R$ '+nf2.format(e.valor||0)});break;
      case 'cisao_qtd': Object.assign(r,{ev:'Cisão (recebido)',q:e.q,val:e.custo!=null?'custo R$ '+nf2.format(e.custo):'custo pendente'});break;
      case 'cisao_ref': Object.assign(r,{ev:'Cisão (ativo de origem)',q:0});break;
      case 'baixa': Object.assign(r,{ev:'Posição encerrada',q:-ant});break;
      case 'incorporacao': if(e.para===t&&e.t!==t)Object.assign(r,{ev:'Incorporação (veio de '+e.t+')',q:e.qPara});else Object.assign(r,{ev:'Incorporado em '+e.para,q:-ant});break;
      case 'ajuste_pm': Object.assign(r,{ev:'Ajuste manual do preço médio',q:0,val:'PM R$ '+nf2.format(e.pm)});break;
      default: Object.assign(r,{ev:e.tipo,q:0});
    }
    L.push(r);
  });
  (S.transf||[]).filter(x=>x.t===t&&x.sentido==='entrada').forEach(x=>L.push({d:x.d,ev:'Transferência para '+x.corretora.split(' ').slice(0,2).join(' '),q:0,val:qtd(x.q)+' cotas',c:0,orig:'B3'}));
  L.sort((a,b)=>(a.d<b.d?1:a.d>b.d?-1:0)*(UI.histAsc?-1:1));
  if(!L.length) return '<div class="panel muted small">Sem movimentações.</div>';
  const fq=v=>v?(v>0?'+':'−')+qtd(Math.abs(Math.round(v*1000)/1000)):'—';
  return `<div class="tbl-wrap"><table><tr><th>Data</th><th>Movimentação</th><th class="n">Qtd</th><th class="n">Preço / valor</th><th class="n">Custos</th><th class="n">Posição</th><th>Origem</th></tr>
  ${L.map(r=>`<tr><td>${dt(r.d)}</td><td>${esc(r.ev)}${r.ed?` <span style="white-space:nowrap"><button class="mini" title="Editar" aria-label="Editar" onclick="editarLanc('${t}','${r.ed.k}','${r.ed.id}')">✏️</button><button class="mini" title="Excluir" aria-label="Excluir" onclick="excluirLanc('${t}','${r.ed.k}','${r.ed.id}')">🗑️</button></span>`:''}</td><td class="n" style="color:${r.q>0?'var(--ok)':r.q<0?'var(--bad)':'inherit'}">${fq(r.q)}</td><td class="n">${esc(r.val)}</td><td class="n">${r.c?nf2.format(r.c):'—'}</td><td class="n">${qtd(Math.round(pos(t,r.d).q*1000)/1000)}</td><td>${esc(r.orig)}</td></tr>`).join('')}</table></div>
  <p class="small muted">A coluna Posição mostra a quantidade no fim de cada dia, já com todos os eventos.</p>`;
}

function projecaoChart(E){
  const M=porMes(E);const cur=HOJE.slice(0,7);const ks=[];for(let i=-11;i<=12;i++)ks.push(addM(cur,i));
  const tot=k=>{const m=M[k]||{};return Object.values(m).reduce((a,b)=>a+b,0)};
  const max=Math.max(...ks.map(tot),1);const W=360,H=200,pad=26,bw=(W-pad)/ks.length;
  const cores={recebido:'var(--st-rec)',provisionado:'var(--st-prov)',anunciado:'var(--st-anun)',projetado:'var(--st-proj)'};
  let bars='';ks.forEach((k,i)=>{let y=H-20;const m=M[k]||{};['recebido','provisionado','anunciado','projetado'].forEach(s=>{const h=(m[s]||0)/max*(H-40);if(h>0){y-=h;bars+=`<rect x="${pad+i*bw+1.5}" y="${y}" width="${bw-3}" height="${h}" rx="2" fill="${cores[s]}"><title>${mLbl(k)}/${k.slice(2,4)} ${EST_LBL[s]}: ${brl(m[s])}</title></rect>`}});
    if(i%2===0)bars+=`<text x="${pad+i*bw+bw/2}" y="${H-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${mLbl(k)}</text>`});
  const xCur=pad+11*bw;
  const prox12=ks.slice(12).reduce((s,k)=>s+tot(k),0); const ult12=ks.slice(0,12).reduce((s,k)=>s+((M[k]||{}).recebido||0),0);
  return `<div class="grid2" style="margin-top:12px"><div class="panel kpi"><div class="l">Últimos 12 meses</div><div class="v num">${brl(ult12)}</div></div><div class="panel kpi"><div class="l">Próximos 12 meses</div><div class="v num">${brl(prox12)}</div><div class="l small">${pct(ult12?(prox12/ult12-1)*100:0)} vs. anterior</div></div></div>
  <div class="panel chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Proventos por mês">
  <line x1="${xCur+bw}" x2="${xCur+bw}" y1="10" y2="${H-20}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${xCur+bw+3}" y="16" font-size="9" fill="var(--muted)">hoje</text>${bars}</svg>
  <div class="legend" style="color:var(--muted)">${Object.entries(cores).map(([k,c])=>`<span><i class="dot" style="background:${c}"></i>${EST_LBL[k]}</span>`).join('')}</div></div>
  <p class="small muted">Projeção: FIIs pela média dos últimos 6 rendimentos; ações repetindo os pagamentos do último ano. Pode desligar em Configurações.</p>`;
}

function resumoLancamento(prontas,total){
  if(!prontas.length) return '';
  const g={};
  prontas.forEach(n=>n.ops.forEach(o=>{
    const k=o.t||o.spec; const r=g[k]=g[k]||{t:o.t,spec:o.spec,qc:0,vc:0,cc:0,qv:0,vv:0,cv:0,notas:new Set()};

    r.notas.add(n.id);
  }));
  const L=Object.values(g).sort((a,b)=>(b.vc+b.vv)-(a.vc+a.vv));
  const tC=L.reduce((s,r)=>s+r.vc,0),tV=L.reduce((s,r)=>s+r.vv,0),tCus=L.reduce((s,r)=>s+r.cc+r.cv,0),tIr=prontas.reduce((s,n)=>s+(n.irrf||0),0);

    if(r.qv) linhas.push(`Venda de <b class="num">${qtd(r.qv)}</b> por <b class="num">${brl(r.vv)}</b> · preço médio ${S.privado?'••':'R$ '+nf2.format(r.vv/r.qv)}`);
    return `<div class="item" style="align-items:flex-start">${r.t?logo(r.t):''}<div class="flex1">
      <div class="row between"><span class="tk">${esc(r.t||'Sem ticker')}</span><span class="small muted">${r.notas.size} nota${r.notas.size>1?'s':''}</span></div>
      <div class="small" style="margin-top:2px">${linhas.join('<br>')}</div>
      <div class="small muted" style="margin-top:2px">Custos ${brl(r.cc+r.cv)} · posição ${qtd(antes)} → <b style="color:var(--ink)">${qtd(depois)}</b></div>
      ${depois<0?`<div class="small" style="color:var(--bad);margin-top:4px">Venda maior que a posição. Importe também as notas das compras anteriores deste ativo.</div>`:''}
    </div></div>`}).join('');
  return `<h2>Resumo do que será lançado</h2>

async function pdfPaginas(file){
  if(!window.pdfjsLib) throw new Error('pdf.js indisponível');
  pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js';
  const data=new Uint8Array(await file.arrayBuffer());
  const doc=await pdfjsLib.getDocument({data,password:UI.senha||undefined}).promise;
  const paginas=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);const c=await pg.getTextContent();const out=[];
    const its=c.items.filter(it=>it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],s:it.str})).sort((a,b)=>b.y-a.y||a.x-b.x);
    const grupos=[];its.forEach(it=>{const g=grupos.find(g=>Math.abs(g.y-it.y)<=3.5);if(g)g.items.push(it);else grupos.push({y:it.y,items:[it]})});
    grupos.sort((a,b)=>b.y-a.y).forEach(g=>out.push(g.items.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ')));

  }

}
function normSpec(s){return s.toUpperCase().replace(/\s+(N1|N2|NM|MA|MB|ED|EJ|EX|ER|ES|EDJ|EDR|CI|ATZ|#|D)(?=\s|$)/g,' ').replace(/\s+/g,' ').trim()}
function resolverTicker(spec){

  const n=normSpec(spec); const mapa=Object.assign({},MAPA_BASE,S.mapa);
  if(mapa[n]) return mapa[n];

const RE_DATA=/(\d{2}\/\d{2}\/\d{4})/;
function cabecalho(linhas){

    m=l.match(/Data\s*(?:do\s*)?preg[aã]o[:\s]*(\d{2}\/\d{2}\/\d{4})/i); if(m&&!data) data=m[1];
    if(/N[rº°o]?\.?\s*(?:da\s*)?nota/i.test(l)&&/preg[aã]o/i.test(l)&&linhas[i+1]){
      const nx=linhas[i+1]; const d=nx.match(RE_DATA); const n=nx.match(/\b(\d{4,})\b/);

}
const CUSTOS=[['liq',/Taxa\s+de\s+liquida[cç][aã]o/i],['reg',/Taxa\s+de\s+registro/i],['termo',/Taxa\s+de\s+termo\s*\/?\s*op[cç][oõ]es/i],['ana',/Taxa\s+A\.?\s*N\.?\s*A\.?/i],['emol',/Emolumentos/i],['transf',/Taxa\s+de\s+Transf(?:\.|er[eê]ncia)?\s+de\s+Ativos/i],['oper',/Taxa\s+Operacional|Corretagem/i],['exec',/Execu[cç][aã]o(?!\s+de)/i],['cust',/Taxa\s+de\s+Cust[oó]dia/i],['iss',/\bISS\b(?:\s*\([^)]*\))?/i],['imp',/\bImpostos\b/i],['outros',/\bOutr[ao]s\b(?!\s+bolsas)/i]];

  const corretora=(linhas.find(l=>/(CCTVM|CTVM|DTVM|CORRETORA|DISTRIBUIDORA|INVESTIMENTOS)/i.test(l)&&!/NOTA DE NEGOCIA|Corretora ou pessoa/i.test(l))||'Corretora não identificada').replace(/\s+(CNPJ|C\.N\.P\.J).*$/i,'').slice(0,70);
  const reS=/(?:1-BOVESPA|BOVESPA|B3 RV LISTADO|B3 RV)\s+([CV])\s+(VISTA|FRACIONARIO|FRACIONÁRIO)\s+(?:\d{2}\/\d{2}\s+)?(.*?)\s*(\d[\d.]*)\s+([\d.]+,\d{2,4})\s+([\d.]+,\d{2})\s+([DC])\b/i;

  return {nr,data,corretora,ops,camada,custos:Math.round(custos*100)/100,det,irrf,liquido:lm?parseBR(lm[1]):null,liqDC:lm?(lm[2]||'D').toUpperCase():null,sinacor:/NOTA DE NEGOCIA/i.test(full)&&/(BOVESPA|B3 RV)/i.test(full)};
}


// Um PDF pode trazer várias notas (uma por página) ou uma nota em várias folhas: junta pelas páginas com o mesmo número de nota

// sugere o ticker comparando a especificação da nota com os nomes que a B3 usa (vindos dos extratos importados)
function sugerirPorNome(spec,dataNota){
  const CODS=/^(FII|CI|ER|ES|EJ|ED|EX|ERS|ON|PN|PNA|PNB|UNT|UNIT|N1|N2|NM|MA|MB|DRN|ATZ|EDJ|EDR|INT|D)$/;
  const toks=normSpec(spec).replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(t=>t&&!CODS.test(t));
  if(!toks.length) return null;
  const nomes={};for(const t in (S.nomes||{}))nomes[t]=[S.nomes[t]];
  for(const t in (S.apelidos||{})) nomes[t]=(nomes[t]||[]).concat(S.apelidos[t]);
  const casa=(tok,palavras)=>{
    if(palavras.some(w=>w.startsWith(tok)))return 2;
    for(let i=0;i<palavras.length;i++){const resto=palavras.slice(i).join('');if(resto[0]!==tok[0])continue;let j=0;for(const ch of resto){if(ch===tok[j])j++;if(j===tok.length)return 1}}
    return 0};
  const cands=[];
  for(const t in nomes){
    if(/(10|12|13|14|15)$/.test(t)) continue; // direitos e recibos de subscrição
    let top=0;
    for(const n of nomes[t]){const palavras=n.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
      let sc=0,ok=true;for(const tok of toks){const c=casa(tok,palavras);if(!c){ok=false;break}sc+=c}
      if(ok)top=Math.max(top,sc/toks.length)}
    if(top) cands.push({t,sc:top});
  }
  if(!cands.length) return null;
  const max=Math.max(...cands.map(c=>c.sc)); const top=cands.filter(c=>c.sc===max);
  if(top.length===1) return top[0].t;
  // empate (ex.: fundo que trocou de ticker): fica com o que já existia na data da nota
  const prim=t=>[...(S.provB3||[]).filter(p=>p.t===t).map(p=>p.pag),...S.ops.filter(o=>o.t===t).map(o=>o.d)].sort()[0]||'9999';
  top.forEach(c=>c.prim=prim(c.t)); top.sort((a,b)=>a.prim<b.prim?-1:1);
  const d=dataNota||HOJE; const existiam=top.filter(c=>c.prim<=somaDias(d,120));
  return (existiam[0]||top[0]).t;
}
function adicionarTexto(txt,arquivo){const n=montarNota(txt,arquivo);UI.notas.push(n||{id:nid('n'),arquivo,status:'semops',ops:[]})}

// ===== Importador dos extratos da Área do Investidor (B3) =====
const B3 = (()=>{
  const sem = s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const num = v=>{if(v==null||v==='-'||v==='')return null;if(typeof v==='number')return v;const s=String(v).trim();if(/,\d+$/.test(s))return Number(s.replace(/\./g,'').replace(',','.'));const n=Number(s);return isNaN(n)?null:n};
  const data = v=>{if(v instanceof Date)return v.toISOString().slice(0,10);const s=String(v??'').trim();let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(m)return `${m[3]}-${m[2]}-${m[1]}`;m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}return ''};
  const corretora = s=>String(s||'').replace(/\s+/g,' ').replace(/\.$/,'').trim();
  function detectar(cab){
    const c=cab.map(sem);
    if(c.includes('data do negocio')&&c.some(x=>x.startsWith('codigo de negociacao'))) return 'negociacao';
    if(c.includes('entrada/saida')&&c.includes('movimentacao')&&c.includes('produto')) return 'movimentacao';
    if(c.includes('produto')&&c.some(x=>x.includes('evento'))&&c.some(x=>x.includes('pagamento')||x.includes('previs'))&&!c.includes('entrada/saida')) return 'provisionados';
    if(c.some(x=>x.startsWith('codigo de negociacao'))&&c.includes('quantidade')&&!c.includes('data do negocio')) return 'posicao';
    return null;
  }
  function linhas(rows){ // rows = array de arrays; 1ª linha útil = cabeçalho
    const i=rows.findIndex(r=>detectar(r||[]));if(i<0)return {tipo:null};
    const cab=rows[i].map(sem);const tipo=detectar(rows[i]);
    const objs=rows.slice(i+1).filter(r=>r&&r.some(x=>x!==null&&x!=='')).map(r=>{const o={};cab.forEach((k,j)=>o[k]=r[j]);return o});
    return {tipo,objs};
  }
  function negociacao(objs){
    const ops={},fut=[],outros=[];
    for(const o of objs){
      const mercado=sem(o['mercado']);let t=String(o['codigo de negociacao']||'').trim().toUpperCase();
      const tipo=/compra/i.test(o['tipo de movimentacao'])?'C':/venda/i.test(o['tipo de movimentacao'])?'V':null;
      const d=data(o['data do negocio']);const q=num(o['quantidade']);const p=num(o['preco']);const v=num(o['valor']);
      if(!tipo||!d||!q) continue;
      if(/futuro|opcao|termo/.test(mercado)){fut.push({d,t,tipo,q});continue}
      if(!/vista|fracion/.test(mercado)){outros.push({d,t,tipo,q,mercado});continue}
      t=t.replace(/F$/,'');
      const k=d+'|'+t+'|'+tipo;
      const r=ops[k]=ops[k]||{key:k,d,t,tipo,q:0,valor:0,corretoras:new Set()};
      r.q+=q;r.valor+=v??q*p;r.corretoras.add(corretora(o['instituicao']));
    }
    const lista=Object.values(ops).map(r=>({key:r.key,d:r.d,t:r.t,tipo:r.tipo,q:r.q,p:r.valor/r.q,valor:Math.round(r.valor*100)/100,corretora:[...r.corretoras].join(' / ')}));
    return {ops:lista,futuros:fut,outros};
  }
  const TIPO_PROV={'rendimento':'rendimento','dividendo':'dividendo','juros sobre capital proprio':'jcp','amortizacao':'amortizacao'};
  function movimentacao(objs){
    const R={provs:[],eventos:[],transf:[],resgates:[],leiloes:[],atualizacoes:[],ignorados:{},nomes:{},tipos:{},apelidos:{}};
    const ign=k=>R.ignorados[k]=(R.ignorados[k]||0)+1;
    const subs=[];
    const lin=objs.map(o=>{
      const prod=String(o['produto']||'');const t=prod.split(' - ')[0].trim().toUpperCase();const nome=prod.split(' - ').slice(1).join(' - ').trim();

/* ---------- Conferência com a B3 ---------- */
function conciliar(){
  const R={saldos:[],orfaos:[],divergencias:[],parados:[],custos:[],ok:0,total:0};
  const provs={};(S.provB3||[]).forEach(p=>(provs[p.t]=provs[p.t]||[]).push(p));
  Object.values(provs).forEach(l=>l.sort((a,b)=>a.pag<b.pag?-1:1));
  const inicioB3=(S.provB3||[]).map(p=>p.pag).sort()[0]||'2019-11-01';
  const limiteInicio=somaDias(inicioB3,120);
  const usadosDe=new Set(S.eventos.filter(e=>e.tipo==='incorporacao'||e.tipo==='baixa').map(e=>e.t));
  const temSaldo=new Set(S.ops.filter(o=>o.orig==='saldo').map(o=>o.t));
  for(const t of Object.keys(provs)){
    const L=provs[t]; if(!/^[A-Z]{4}\d{1,2}$/.test(t)||/(10|12|13|14|15)$/.test(t)) continue;
    // saldo anterior ao início da B3
    if(!temSaldo.has(t)){
      let falta=0;L.filter(p=>p.pag<=limiteInicio).forEach(p=>{falta=Math.max(falta,p.q-pos(t,p.pag).q)});
      const fim=pos(t,'9999-12-31').q; if(fim<-0.5) falta=Math.max(falta,-fim);
      if(falta>0.5&&L[0].pag<=limiteInicio){R.saldos.push({t,q:Math.round(falta*1000)/1000,primeiro:L[0]});continue}
    }
    // entrada sem origem: a B3 pagou sobre mais cotas do que o app conhece (incorporação ou troca de ticker que a B3 não lista)
    let salto=null;
    for(const p of L){ if(p.pag<=limiteInicio) continue;
      const calc=Math.max(pos(t,somaDias(p.pag,-45)).q,pos(t,p.pag).q); const gap=p.q-calc; if(gap>1.5&&gap/p.q>0.05){salto={p,gap};break} }
    if(salto){
      const p0=salto.p;
      const fr=S.eventos.filter(e=>e.t===t&&e.tipo==='fracao'&&e.dataEx<=p0.pag&&e.dataEx>=somaDias(p0.pag,-60)).reduce((s,e)=>s+e.q,0);
      const cand=[];
      S.eventos.filter(e=>e.tipo==='resgate'&&!e.incorporadoEm&&e.t!==t&&e.dataEx<=p0.pag&&e.dataEx>=somaDias(p0.pag,-150)).forEach(e=>cand.push({de:e.t,data:e.dataEx,caixa:e.valor||0,resgate:e.id,motivo:`resgate de ${qtd(e.q)} cotas em ${dt(e.dataEx)}`}));
      Object.keys(provs).forEach(o=>{if(o===t||usadosDe.has(o)||/(10|12|13|14|15)$/.test(o))return;const lo=provs[o];const ult=lo[lo.length-1];
        if(ult.pag<p0.pag&&ult.pag>=somaDias(p0.pag,-120)&&pos(o,HOJE).q>0.5&&!cand.some(c=>c.de===o))cand.push({de:o,data:somaDias(ult.pag,15),caixa:0,motivo:`parou de pagar em ${dt(ult.pag)} com ${qtd(pos(o,HOJE).q)} cotas`})});
      const evPara=S.eventos.filter(e=>e.t===t&&e.dataEx>=somaDias(p0.pag,-60)).map(e=>e.dataEx);
      cand.forEach(c=>{c.data=[c.data,...evPara,p0.pag].sort()[0]});
      R.orfaos.push({t,primeiro:p0,gap:salto.gap,qSug:Math.round((salto.gap+fr)*1000)/1000,cand});continue;
    }
    // confere a posição com o último ponto informado pela B3 (provento ou atualização de posição)
    const atu=(S.posB3||[]).filter(x=>x.t===t).sort((x,y)=>x.d<y.d?-1:1); const ua=atu[atu.length-1]; const u=L[L.length-1];
    const ref=ua&&ua.d>=u.pag?{d:ua.d,q:ua.q,atu:true}:{d:u.pag,q:u.q};
    if(ref.d>=somaDias(HOJE,-400)||pos(t,HOJE).q>0.5){
      R.total++;
      let bate;
      if(ref.atu){const c=pos(t,ref.d).q;bate=Math.abs(c-ref.q)<0.01||Math.abs(pos(t,somaDias(ref.d,-3)).q-ref.q)<0.01}
      else{const ini=somaDias(ref.d,-300);const ds=[ini,...S.ops.filter(o=>o.t===t&&o.d>ini&&o.d<=ref.d).map(o=>o.d),...eventosAplicados().filter(e=>(e.t===t||e.para===t)&&e.dataEx>ini&&e.dataEx<=ref.d).map(e=>e.dataEx)];bate=ds.some(d=>Math.abs(pos(t,d).q-ref.q)<0.01)}
      if(bate)R.ok++; else R.divergencias.push({t,u:{q:ref.q,pag:ref.d},calc:pos(t,ref.d).q,atu:!!ref.atu});
    }
  }
  // posições paradas (sem provento recente)
  for(const t of tickers()){
    const q=pos(t,HOJE).q; if(q<=0.001||usadosDe.has(t)) continue;
    const L=provs[t]; const ult=L?L[L.length-1].pag:null;
    if(!L&&(S.provB3||[]).length&&!(S.posB3||[]).some(x=>x.t===t)&&!S.ops.some(o=>o.t===t&&o.d>=somaDias(HOJE,-400))){R.parados.push({t,q,ult:null});continue}
    const ua=(S.posB3||[]).filter(x=>x.t===t).map(x=>x.d).sort().pop(); const ultRef=[ult,ua].filter(Boolean).sort().pop();
    if(ultRef&&ultRef<somaDias(HOJE,-400)&&!R.saldos.some(s=>s.t===t)) R.parados.push({t,q,ult:ultRef});
  }
  // custos que a B3 não informa
  R.estimados=S.eventos.filter(e=>e.status==='aplicado'&&e.tipo==='subscricao'&&e.estimado);

const CUSTOS_BONIF={'SULA4|2021-03':13.73,'ITSA4|2021-12':18.89,'ITSA3|2021-12':18.89,'ROMI3|2022-10':18.23,'ITSA4|2022-11':13.65,'ITSA3|2022-11':13.65,'ROMI3|2023-04':16.53,'ITSA4|2023-11':17.917246,'ITSA3|2023-11':17.917246,'ROMI3|2024-04':18.86,'ITSA4|2024-12':13.55518731,'ITSA3|2024-12':13.55518731,'ITUB3|2025-03':34.00,'ITUB4|2025-03':34.00,'EGIE3|2025-11':6.0086788,'ITSA4|2025-12':11.370033972,'ITSA3|2025-12':11.370033972};
function custoOficial(e){if(e.tipo!=='bonif_qtd')return null;const m=e.dataEx.slice(0,7);for(const k of [m,addM(m,-1),addM(m,1)]){const v=CUSTOS_BONIF[e.t+'|'+k];if(v!=null)return v}return null}
// preços de subscrição que a B3 informa pelo valor da operação (quando o preço unitário vem vazio)
const SUBS_CONHECIDAS={'VISC11|2020-02':126.50,'ITSA4|2025-05':6.70};
// aplica sozinho tudo o que já se sabe: custo oficial das bonificações, preços conhecidos, estimativas e eventos conhecidos
function aplicarConhecidos(){
  let mudou=0;
  for(const e of S.eventos){
    if(e.tipo==='bonif_qtd'&&e.custo==null){const v=custoOficial(e);if(v!=null){e.custo=v;e.auto='oficial';mudou++}}
    if(e.tipo==='subscricao'&&e.preco==null){const k=e.t+'|'+e.dataEx.slice(0,7);if(SUBS_CONHECIDAS[k]!=null){e.preco=SUBS_CONHECIDAS[k];e.auto='b3';mudou++}else{const est=estimarSubscricao(e);if(est){e.preco=Math.round(est.p*100)/100;e.estimado=true;e.auto='estimado';e.estTxt=est.txt;mudou++}}}
  }
  // XPart (XPAR3): veio da cisão do Itaú em out/2021 e foi incorporada pela XP Inc. na mesma semana,
  // na proporção de 1 BDR XPBR31 para 43,3128 XPAR3; quem tinha menos que isso recebeu a fração em dinheiro.
  const ci=S.eventos.find(e=>e.t==='XPAR3'&&e.tipo==='cisao_qtd');
  if(ci){
    if(ci.custo==null){ci.custo=0;ci.auto='xpart';mudou++}
    if(!S.eventos.some(e=>e.t==='XPAR3'&&(e.tipo==='incorporacao'||e.tipo==='baixa'||e.tipo==='xpart'))){
      const bdr=Math.floor(ci.q/43.3128323+1e-9);
      S.eventos.push({id:nid('e'),key:'xpart|'+ci.dataEx,t:'XPAR3',tipo:'fracao',dataEx:ci.dataEx,q:ci.q,valor:0,status:'aplicado',origem:'Evento conhecido',lote:ci.lote,
        desc:`XPart incorporada pela XP Inc.: ${qtd(ci.q)} XPAR3 = ${(ci.q/43.3128323).toLocaleString('pt-BR',{maximumFractionDigits:2})} BDR XPBR31 (1 para 43,31)${bdr?'':', menos de 1 BDR, pago em dinheiro após leilão'}`});
      if(bdr){S.eventos[S.eventos.length-1].q=ci.q;}
      mudou++;
    }
  }
  if(mudou){save();POSC.clear()}
  return mudou;
}

  const lote=nid('I');

function incorporarAutomatico(){

function estimarSubscricao(e){
  const ops=S.ops.filter(o=>o.t===e.t&&o.tipo==='C'&&o.d>=somaDias(e.dataEx,-120)&&o.d<=somaDias(e.dataEx,120));
  if(ops.length){const q=ops.reduce((s,o)=>s+o.q,0);return {p:ops.reduce((s,o)=>s+o.q*o.p,0)/q,txt:`média das suas ${ops.length} compra${ops.length>1?'s':''} de ${e.t} entre ${dt(somaDias(e.dataEx,-120))} e ${dt(somaDias(e.dataEx,120))}`}}
  const todas=S.ops.filter(o=>o.t===e.t&&o.tipo==='C').sort((a,b)=>Math.abs(new Date(a.d)-new Date(e.dataEx))-Math.abs(new Date(b.d)-new Date(e.dataEx)));
  return todas[0]?{p:todas[0].p,txt:`sua compra de ${e.t} mais próxima, em ${dt(todas[0].d)}`}:null;
}
